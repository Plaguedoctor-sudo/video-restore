[project]
name = "video-restore"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "numpy>=1.24",
]

[project.scripts]
restore = "restore.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["restore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
